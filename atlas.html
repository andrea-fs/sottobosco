<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlante · Nido</title>
<meta name="theme-color" content="#eef0ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nido">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="core/base.css?v=5">
<link rel="stylesheet" href="atlas.css?v=5">
</head>
<body>
<div class="boot" id="boot">Apro l’atlante…</div>
<div id="app" hidden>
  <header class="at-top">
    <a class="home" href="./" aria-label="Torna al Nido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
    <div class="at-title"><h1>Atlante</h1><button class="muted small" id="atSub" type="button"></button></div>
    <button class="btn primary sm" id="addBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Aggiungi</button>
  </header>

  <div class="stage">
    <section id="mapView" aria-label="Mappa">
      <svg id="map" role="img" aria-label="Mappa del mondo con i vostri viaggi"></svg>
      <div class="overlay">
        <div class="ov-row">
          <div class="glass counts"><span><b id="cCountries">0</b>paesi</span><span><b id="cCities">0</b>città</span><span><b id="cKm">0</b>km</span></div>
        </div>
        <div class="ov-row">
          <div class="glass mini-seg" id="projSeg" role="tablist"><button role="tab" data-proj="flat" aria-selected="true">Mappa</button><button role="tab" data-proj="globe" aria-selected="false">Globo</button></div>
          <div class="glass mini-seg" id="whoSeg"></div>
        </div>
        <button class="glass next" id="next" hidden></button>
      </div>
      <div class="glass empty-map" id="emptyMap" hidden></div>
      <div class="glass legend" id="legend" hidden></div>
      <div class="fab-col">
        <button class="glass rbtn" id="routesBtn" aria-pressed="true" aria-label="Mostra le rotte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="3 3"><path d="M4 18c3-9 13-12 16-6"/></svg></button>
        <button class="glass rbtn" id="fitBtn" aria-label="Mostra tutti i posti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      </div>
    </section>
    <section class="scroll" id="v-diary" hidden aria-label="Diario"><div class="stack" id="diary"></div></section>
    <section class="scroll" id="v-dreams" hidden aria-label="Sogni"><div class="stack" id="dreams"></div></section>
    <section class="scroll" id="v-passport" hidden aria-label="Passaporto"><div class="stack" id="passport"></div></section>
  </div>

  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-v="map" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>Mappa</button>
    <button role="tab" data-v="diary" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M9 8h6M9 12h4"/></svg>Diario</button>
    <button role="tab" data-v="dreams" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5-7-11a7 7 0 0 1 14 0c0 6-7 11-7 11z" stroke-dasharray="3 2.5"/><circle cx="12" cy="10" r="2.5"/></svg>Sogni</button>
    <button role="tab" data-v="passport" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3.2"/><path d="M9 17h6"/></svg>Passaporto</button>
  </nav>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></svg>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Posto"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js?v=5"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="core/core.js?v=5"></script>
<script src="atlas.js?v=5"></script>
</body>
</html>
