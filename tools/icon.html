<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:#2f6b47}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script>
// Renders the Nido app icon (tools: open with ?s=<size>, the PNG data URL lands in the title).
const S = +new URLSearchParams(location.search).get('s') || 512, cv = document.getElementById('c');
cv.width = S; cv.height = S; const c = cv.getContext('2d'); const k = S / 160;
const g = c.createLinearGradient(0, 0, 0, S); g.addColorStop(0, '#3f7d57'); g.addColorStop(1, '#1d4430'); c.fillStyle = g; c.fillRect(0, 0, S, S);
const halo = c.createRadialGradient(80 * k, 70 * k, 0, 80 * k, 70 * k, 70 * k); halo.addColorStop(0, 'rgba(255,236,190,.30)'); halo.addColorStop(1, 'rgba(255,236,190,0)'); c.fillStyle = halo; c.fillRect(0, 0, S, S);
c.save(); c.translate(0, 8 * k); c.scale(k, k);
c.fillStyle = '#7a5236'; c.beginPath(); c.ellipse(80, 104, 62, 30, 0, 0, Math.PI); c.fill();
c.fillStyle = '#5e3e28'; c.beginPath(); c.ellipse(80, 96, 58, 16, 0, 0, Math.PI * 2); c.fill();
c.fillStyle = '#cfe3d4'; c.beginPath(); c.ellipse(68, 84, 16, 21, -.18, 0, Math.PI * 2); c.fill();
c.fillStyle = '#f2d2da'; c.beginPath(); c.ellipse(93, 85, 15, 20, .16, 0, Math.PI * 2); c.fill();
c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(63, 77, 4, 6, -.3, 0, Math.PI * 2); c.ellipse(88, 78, 3.5, 5.5, -.2, 0, Math.PI * 2); c.fill();
c.strokeStyle = '#a7774f'; c.lineWidth = 3; c.lineCap = 'round';
for (let i = 0; i < 16; i++) { const a = Math.PI * (i / 15), x = 80 + Math.cos(a) * 62, y = 100 + Math.sin(a) * 26; c.beginPath(); c.moveTo(x - 14, y - 5 + (i % 2) * 4); c.quadraticCurveTo(x, y + 6, x + 16, y - 3); c.stroke(); }
c.strokeStyle = '#8e6040'; for (let i = 0; i < 9; i++) { c.beginPath(); c.moveTo(22 + i * 13, 98 + (i % 2) * 4); c.quadraticCurveTo(30 + i * 13, 112, 40 + i * 13, 100); c.stroke(); }
const leaf = (x, y, l, w, a, col) => { c.save(); c.translate(x, y); c.rotate(a); c.fillStyle = col; c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(l * .3, -w, l * .75, -w * .8, l, 0); c.bezierCurveTo(l * .75, w * .8, l * .3, w, 0, 0); c.fill(); c.restore(); };
leaf(128, 92, 26, 8, -.6, '#7cc45e'); leaf(32, 94, 22, 7, -2.6, '#5aa046');
c.restore();
document.title = cv.toDataURL('image/png');
</script></body></html>
