<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:#2f6b47}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script>
// Renders the app icon at the window size (used by tools/make-icons.sh).
const S = +new URLSearchParams(location.search).get("s") || 512, cv = document.getElementById("c");
cv.width = S; cv.height = S; const c = cv.getContext('2d');
const g = c.createLinearGradient(0, 0, 0, S); g.addColorStop(0, '#3f7d57'); g.addColorStop(1, '#1f4a33'); c.fillStyle = g; c.fillRect(0, 0, S, S);
const k = S / 100;
const halo = c.createRadialGradient(50 * k, 42 * k, 0, 50 * k, 42 * k, 40 * k); halo.addColorStop(0, 'rgba(255,240,190,.28)'); halo.addColorStop(1, 'rgba(255,240,190,0)'); c.fillStyle = halo; c.fillRect(0, 0, S, S);
c.fillStyle = '#6a4a33'; c.beginPath(); c.ellipse(50 * k, 74 * k, 30 * k, 15 * k, 0, 0, Math.PI); c.fill();
c.fillStyle = '#57392a'; c.beginPath(); c.ellipse(50 * k, 74 * k, 18 * k, 10 * k, 0, .3, Math.PI - .3); c.fill();
const gg = c.createLinearGradient(0, 66 * k, 0, 82 * k); gg.addColorStop(0, '#9ccd70'); gg.addColorStop(1, '#73a852'); c.fillStyle = gg; c.beginPath(); c.ellipse(50 * k, 73 * k, 31 * k, 8.5 * k, 0, 0, Math.PI * 2); c.fill();
c.strokeStyle = '#4f8a3c'; c.lineWidth = 2.6 * k; c.lineCap = 'round'; c.beginPath(); c.moveTo(50 * k, 73 * k); c.quadraticCurveTo(53 * k, 52 * k, 49 * k, 33 * k); c.stroke();
const leaf = (x, y, l, w, a, col) => { c.save(); c.translate(x * k, y * k); c.rotate(a); c.fillStyle = col; c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(l * .3 * k, -w * k, l * .75 * k, -w * .8 * k, l * k, 0); c.bezierCurveTo(l * .75 * k, w * .8 * k, l * .3 * k, w * k, 0, 0); c.fill(); c.restore(); };
leaf(51, 57, 20, 7, -.45, '#6fb055'); leaf(50, 63, 18, 6.5, -2.7, '#4f8f3e');
for (let i = 0; i < 16; i++) { c.save(); c.translate(49 * k, 31 * k); c.rotate(i * Math.PI / 8 + .1); c.fillStyle = i % 2 ? '#ffffff' : '#ece8dc'; c.beginPath(); c.ellipse(8 * k, 0, 7.4 * k, 2.3 * k, 0, 0, Math.PI * 2); c.fill(); c.restore(); }
c.fillStyle = '#f0b42c'; c.beginPath(); c.arc(49 * k, 31 * k, 4.4 * k, 0, Math.PI * 2); c.fill();
document.title = cv.toDataURL("image/png");
</script></body></html>
