<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sogni · Nido</title>
<meta name="theme-color" content="#eef0ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nido">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="core/base.css?v=6">
<link rel="stylesheet" href="dreams.css?v=6">
</head>
<body>
<div class="boot" id="boot">Apro i sogni…</div>
<div id="app" hidden>
  <header class="dr-top">
    <a class="home" href="./" aria-label="Torna al Nido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
    <div><h1>Sogni</h1><p class="muted small">Il diario delle vostre notti</p></div>
  </header>
  <main id="main">
    <section class="tonight" aria-label="Stanotte">
      <canvas class="stars" id="stars" aria-hidden="true" style="width:100%;height:100%"></canvas>
      <h2>Stanotte ho sognato…</h2>
      <p id="tonightSub">Tocca la faccina di come ti sei sentito. Basta questo.</p>
      <div class="moods" id="moods"></div>
      <div id="logged"></div>
    </section>
    <section aria-label="Le ultime due settimane">
      <div class="sec" style="margin-bottom:10px"><h2>Le ultime 14 notti</h2></div>
      <div class="nights" id="nights"></div>
    </section>
    <section aria-label="Questo mese">
      <div class="sec" style="margin-bottom:10px"><h2>Questo mese</h2><p class="muted small" id="monthN"></p></div>
      <div class="chips" id="month"></div>
    </section>
    <p class="same" id="same" hidden></p>
    <section aria-label="Tutti i sogni"><div class="sec" style="margin-bottom:10px"><h2>Notte per notte</h2></div><div class="feed" id="feed"></div></section>
  </main>
</div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Sogno"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js?v=6"></script>
<script src="vendor/supabase.js"></script>
<script src="core/core.js?v=6"></script>
<script src="dreams.js?v=6"></script>
</body>
</html>
