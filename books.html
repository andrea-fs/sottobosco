<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biblioteca · Nido</title>
<meta name="theme-color" content="#eef0ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nido">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="core/base.css?v=5">
<link rel="stylesheet" href="books.css?v=4">
</head>
<body>
<div class="boot" id="boot">Apro la biblioteca…</div>
<div id="app" hidden>
  <header class="bk-top">
    <a class="home" href="./" aria-label="Torna al Nido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
    <div class="bk-title"><h1>Biblioteca</h1><p class="muted small" id="bkSub"></p></div>
    <button class="btn primary sm" id="addBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Aggiungi</button>
  </header>

  <main id="main">
    <section class="view" id="v-shelf" aria-label="Scaffale">
      <div>
        <div class="sec" style="margin-bottom:10px"><h2>Sul comodino</h2><p class="muted small" id="nsCount"></p></div>
        <div class="nightstand" id="nightstand"></div>
      </div>
      <div class="tools">
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="input" id="q" type="search" placeholder="Cerca tra i libri letti" autocomplete="off" aria-label="Cerca tra i libri letti"></div>
        <div class="toolrow">
          <div class="seg" role="tablist" id="who"></div>
          <select class="sortsel" id="sort" aria-label="Ordina">
            <option value="recent">Recenti</option>
            <option value="rating">Voto</option>
            <option value="title">Titolo</option>
            <option value="author">Autore</option>
          </select>
        </div>
      </div>
      <div id="shelves"></div>
    </section>

    <section class="view" id="v-pile" hidden aria-label="Da leggere"><div id="pile" class="stack"></div></section>

    <section class="view" id="v-quotes" hidden aria-label="Citazioni">
      <div class="sec"><h2>Citazioni</h2><p class="muted small">Le frasi che vi sono rimaste</p></div>
      <div class="quotes" id="quotes"></div>
    </section>

    <section class="view" id="v-year" hidden aria-label="Il vostro anno">
      <div class="yearnav">
        <button class="iconbtn" id="yPrev" aria-label="Anno precedente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
        <b id="yLabel"></b>
        <button class="iconbtn" id="yNext" aria-label="Anno successivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
      <div id="year" class="stack"></div>
    </section>
  </main>

  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-v="shelf" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V4h3v17M8 21V7h3v14M13 21l-1-15 3-.4 2 15.2"/></svg>Scaffale</button>
    <button role="tab" data-v="pile" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="15" width="18" height="5" rx="1"/><rect x="5" y="10" width="15" height="5" rx="1"/><rect x="4" y="5" width="14" height="5" rx="1"/></svg>Da leggere</button>
    <button role="tab" data-v="quotes" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7H5v6h4v-2c0 3-1 4.5-3 5.5M19 7h-4v6h4v-2c0 3-1 4.5-3 5.5"/></svg>Citazioni</button>
    <button role="tab" data-v="year" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Il vostro anno</button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Libro"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js?v=5"></script>
<script src="vendor/supabase.js"></script>
<script src="core/core.js?v=5"></script>
<script src="books.js?v=4"></script>
</body>
</html>
